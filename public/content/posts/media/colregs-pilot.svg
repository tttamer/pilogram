<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" fill="none">
  <defs>
    <filter id="red-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#EF4444" flood-opacity="0.9"/>
    </filter>
    <filter id="green-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#10B981" flood-opacity="0.9"/>
    </filter>
    <filter id="white-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#FFFFFF" flood-opacity="0.9"/>
    </filter>
  </defs>

  <rect width="400" height="320" rx="16" fill="#090D16"/>
  <rect x="1" y="1" width="398" height="318" rx="15" stroke="#1E293B" stroke-width="1"/>

  <!-- Title -->
  <text x="200" y="28" fill="#F8FAFC" font-size="13.5" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">RIPEAM REGRA 29 • EMBARCAÇÃO DE PRATICAGEM</text>
  <line x1="20" y1="38" x2="380" y2="38" stroke="#334155" stroke-width="1"/>

  <!-- Left: Lancha de Prático em Serviço (Noite) -->
  <rect x="20" y="50" width="200" height="215" rx="8" fill="#0F172A" stroke="#1E293B"/>
  <text x="120" y="70" fill="#94A3B8" font-size="11" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">LUZES NO TOPO DO MASTRO</text>

  <!-- Mastro -->
  <line x1="120" y1="85" x2="120" y2="180" stroke="#475569" stroke-width="2.5"/>
  <line x1="60" y1="180" x2="180" y2="180" stroke="#475569" stroke-width="2.5"/>

  <!-- White over Red (360°) -->
  <!-- Top: White -->
  <circle cx="120" cy="100" r="9" fill="#F8FAFC" filter="url(#white-glow)"/>
  <circle cx="120" cy="100" r="5" fill="#FFFFFF"/>
  <text x="145" y="104" fill="#F8FAFC" font-size="10" font-weight="bold" font-family="system-ui, sans-serif">Branca (360°)</text>

  <!-- Bottom: Red -->
  <circle cx="120" cy="130" r="9" fill="#EF4444" filter="url(#red-glow)"/>
  <circle cx="120" cy="130" r="5" fill="#FECACA"/>
  <text x="145" y="134" fill="#EF4444" font-size="10" font-weight="bold" font-family="system-ui, sans-serif">Vermelha (360°)</text>

  <text x="120" y="160" fill="#38BDF8" font-size="9.5" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">"White over Red, Pilot ahead"</text>

  <!-- Sidelights (when making way) -->
  <circle cx="60" cy="180" r="6" fill="#EF4444" filter="url(#red-glow)"/>
  <text x="40" y="198" fill="#EF4444" font-size="8.5" font-weight="bold" font-family="system-ui, sans-serif">BB (Red)</text>

  <circle cx="180" cy="180" r="6" fill="#10B981" filter="url(#green-glow)"/>
  <text x="160" y="198" fill="#10B981" font-size="8.5" font-weight="bold" font-family="system-ui, sans-serif">BE (Verde)</text>

  <text x="120" y="225" fill="#CBD5E1" font-size="8.5" font-family="system-ui, sans-serif" text-anchor="middle">Com seguimento: + BB/BE + Alcançado</text>
  <text x="120" y="240" fill="#94A3B8" font-size="8.5" font-family="system-ui, sans-serif" text-anchor="middle">Fundeada: + Luz de Fundeio (R.30)</text>
  <text x="120" y="254" fill="#EF4444" font-size="8.5" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">SEM luz de mastro convencional!</text>

  <!-- Right: Sinais e Mnemônicos -->
  <rect x="230" y="50" width="150" height="215" rx="8" fill="#0F172A" stroke="#1E293B"/>
  <text x="305" y="70" fill="#94A3B8" font-size="10" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">IDENTIFICAÇÃO SONORA</text>

  <!-- Sound icon / Horn -->
  <rect x="245" y="85" width="120" height="70" rx="6" fill="#1E293B"/>
  <text x="305" y="105" fill="#FBBF24" font-size="11" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">Regra 35(i)</text>
  
  <!-- 4 short blasts dots -->
  <g transform="translate(262, 118)">
    <circle cx="12" cy="10" r="5" fill="#FBBF24"/>
    <circle cx="32" cy="10" r="5" fill="#FBBF24"/>
    <circle cx="52" cy="10" r="5" fill="#FBBF24"/>
    <circle cx="72" cy="10" r="5" fill="#FBBF24"/>
  </g>
  <text x="305" y="145" fill="#FDE047" font-size="9.5" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">4 Apitos Curtos (••••)</text>

  <rect x="245" y="165" width="120" height="90" rx="6" fill="#18181B" stroke="#334155"/>
  <text x="305" y="182" fill="#E2E8F0" font-size="9" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">FORA DE SERVIÇO</text>
  <text x="305" y="200" fill="#94A3B8" font-size="8" font-family="system-ui, sans-serif" text-anchor="middle">Regra 29(b):</text>
  <text x="305" y="215" fill="#CBD5E1" font-size="8" font-family="system-ui, sans-serif" text-anchor="middle">Exibe apenas luzes</text>
  <text x="305" y="228" fill="#CBD5E1" font-size="8" font-family="system-ui, sans-serif" text-anchor="middle">ordinárias de seu porte</text>
  <text x="305" y="243" fill="#EF4444" font-size="8" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">(apaga Branca/Vermelha)</text>

  <!-- Footer Tip -->
  <rect x="20" y="275" width="360" height="32" rx="6" fill="#1E1B4B" stroke="#4338CA"/>
  <text x="200" y="295" fill="#E0E7FF" font-size="10.5" font-weight="bold" font-family="system-ui, sans-serif" text-anchor="middle">⚠️ "White over Red, pilot ahead" / 4 apitos curtos em neblina</text>
</svg>